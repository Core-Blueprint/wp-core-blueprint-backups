name: Backups WordPress.org distribution conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core-blueprint-backups.php'
      - 'tests/updates-pilot-regression.php'
      - 'readme.txt'
      - '.github/workflows/updates-pilot-conformance.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint WordPress.org distribution surface
        run: |
          php -l core-blueprint-backups.php
          php -l tests/updates-pilot-regression.php

      - name: Run WordPress.org distribution regression
        run: php tests/updates-pilot-regression.php
