name: Backups Golden i18n refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: backups-golden-i18n-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install translation tooling
        run: python -m pip install --disable-pip-version-check polib deep-translator

      - name: Refresh catalogs when quality gate fails
        run: |
          if python tools/refresh-translations.py --check; then
            echo "Translation catalogs already pass the Golden quality gate."
            exit 0
          fi
          python tools/refresh-translations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages/core-blueprint-backups-*.po languages/core-blueprint-backups-*.mo
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "Refresh Backups Golden translations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
