name: Database timezone portability

on:
  pull_request:
    paths:
      - 'src/DB/SqlValueCodec.php'
      - 'tests/integration/database-timezone-portability.php'
      - '.github/workflows/database-timezone-portability.yml'
  push:
    branches: [fix/database-timezone-portability]
    paths:
      - 'src/DB/SqlValueCodec.php'
      - 'tests/integration/database-timezone-portability.php'
      - '.github/workflows/database-timezone-portability.yml'

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: cb_backups_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      CB_BACKUPS_TEST_DISPOSABLE: '1'
      CB_TEST_WP_ROOT: /tmp/cb-wordpress
      CB_TEST_DB_NAME: cb_backups_test
      CB_TEST_DB_USER: root
      CB_TEST_DB_PASSWORD: disposable-test-password
      CB_TEST_DB_HOST: 127.0.0.1:3306
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP database extensions
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql php-mbstring php-xml php-zip
      - name: Download pinned official WordPress source
        run: |
          curl --fail --location --retry 2 https://wordpress.org/wordpress-6.8.3.tar.gz -o /tmp/cb-wordpress.tar.gz
          mkdir -p "$CB_TEST_WP_ROOT"
          tar -xzf /tmp/cb-wordpress.tar.gz -C "$CB_TEST_WP_ROOT" --strip-components=1
      - name: TIMESTAMP portability round-trip
        run: php tests/integration/database-timezone-portability.php
