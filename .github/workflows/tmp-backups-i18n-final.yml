name: Temporary Backups final i18n QC

on:
  push:
    branches:
      - qc/backups-launch-readiness
    paths:
      - '.github/workflows/tmp-backups-i18n-final.yml'

permissions:
  contents: write

jobs:
  i18n:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog tooling
        run: |
          python -m pip install --disable-pip-version-check polib deep-translator
          sudo apt-get update -qq && sudo apt-get install -y gettext
      - name: Build protected launch catalogs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, time
          from pathlib import Path
          import polib
          from deep_translator import GoogleTranslator
          from deep_translator.exceptions import TranslationNotFound

          pot = polib.pofile('languages/core-blueprint-backups.pot')
          entries = [e for e in pot if e.msgid and not e.obsolete]
          locales = {
              'nl_NL': ('nl','nplurals=2; plural=(n != 1);'),
              'de_DE': ('de','nplurals=2; plural=(n != 1);'),
              'fr_FR': ('fr','nplurals=2; plural=(n > 1);'),
              'es_ES': ('es','nplurals=2; plural=(n != 1);'),
              'it_IT': ('it','nplurals=2; plural=(n != 1);'),
              'pt_PT': ('pt','nplurals=2; plural=(n != 1);'),
          }
          token_re = re.compile(r'%(?:\d+\$)?[-+0 #]*(?:\d+)?(?:\.\d+)?[bcdeEfFgGosuxX]|\{[A-Za-z0-9_.:-]+\}|<[^>]+>|\[[A-Za-z0-9_.:/-]+\]')
          printf_re = re.compile(r'%(?:\d+\$)?[-+0 #]*(?:\d+)?(?:\.\d+)?[bcdeEfFgGosuxX]')
          brace_re = re.compile(r'\{[A-Za-z0-9_.:-]+\}')
          html_re = re.compile(r'<[^>]+>')
          sep = ' CBSEPARATOR2026KEEP '

          def sig(s): return (printf_re.findall(s), brace_re.findall(s), html_re.findall(s))
          def trans(tr, text):
              if not text.strip(): return text
              last = None
              for attempt in range(3):
                  try: return tr.translate(text) or text
                  except TranslationNotFound: return text
                  except Exception as exc:
                      last = exc; time.sleep(1 + attempt)
              raise RuntimeError(f'translation failed: {last}')
          def protected(tr, source):
              out=[]; pos=0
              for m in token_re.finditer(source):
                  out.append(trans(tr, source[pos:m.start()])); out.append(m.group(0)); pos=m.end()
              out.append(trans(tr, source[pos:])); value=''.join(out)
              if sig(source) != sig(value): raise RuntimeError(f'placeholder mismatch: {source!r} -> {value!r}')
              return value

          unique=[]; seen=set()
          for e in entries:
              for value in (e.msgid, e.msgid_plural):
                  if value and value not in seen: seen.add(value); unique.append(value)

          for locale,(target,plural_forms) in locales.items():
              tr=GoogleTranslator(source='en', target=target); translated={}
              plain=[v for v in unique if not token_re.search(v)]
              special=[v for v in unique if token_re.search(v)]
              groups=[]; group=[]; chars=0
              for value in plain:
                  projected=chars+len(value)+len(sep)
                  if group and projected>2200:
                      groups.append(group); group=[]; chars=0
                  group.append(value); chars += len(value)+len(sep)
              if group: groups.append(group)
              for group in groups:
                  try: parts=trans(tr, sep.join(group)).split(sep)
                  except Exception: parts=[]
                  if len(parts) != len(group): parts=[trans(tr, value) for value in group]
                  for source,value in zip(group,parts): translated[source]=value.strip()
              for source in special: translated[source]=protected(tr, source)

              po=polib.POFile(); po.metadata={
                  'Project-Id-Version':'Core Blueprint Backups 1.0.0-rc1',
                  'PO-Revision-Date':time.strftime('%Y-%m-%d %H:%M+0000',time.gmtime()),
                  'Last-Translator':'Core Blueprint','Language-Team':locale,'Language':locale,
                  'MIME-Version':'1.0','Content-Type':'text/plain; charset=UTF-8',
                  'Content-Transfer-Encoding':'8bit','Plural-Forms':plural_forms,
              }
              for src in entries:
                  e=polib.POEntry(msgid=src.msgid,msgctxt=src.msgctxt,occurrences=list(src.occurrences),comment=src.comment,tcomment=src.tcomment,flags=list(src.flags))
                  if src.msgid_plural:
                      e.msgid_plural=src.msgid_plural; e.msgstr_plural[0]=translated[src.msgid]; e.msgstr_plural[1]=translated[src.msgid_plural]
                  else: e.msgstr=translated[src.msgid]
                  po.append(e)
              pp=Path('languages')/f'core-blueprint-backups-{locale}.po'; mp=Path('languages')/f'core-blueprint-backups-{locale}.mo'
              po.save(str(pp)); po.save_as_mofile(str(mp)); print(f'{locale}_ENTRIES={len(entries)}')
          PY
          for locale in nl_NL de_DE fr_FR es_ES it_IT pt_PT; do
            po="languages/core-blueprint-backups-${locale}.po"; mo="languages/core-blueprint-backups-${locale}.mo"
            msgfmt --check --check-format -o "/tmp/${locale}.mo" "$po"
            missing=$(msgattrib --untranslated "$po" | grep -c '^msgid ' || true)
            echo "${locale}_UNTRANSLATED=${missing}"; test "$missing" -eq 0
            test -s "$mo"
          done
      - name: PHP and contract sanity
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/backups-php-lint.log
          grep -q "Text Domain: core-blueprint-backups" core-blueprint-backups.php
          grep -q "Domain Path: /languages" core-blueprint-backups.php
          grep -q "load_plugin_textdomain( 'core-blueprint-backups'" core-blueprint-backups.php
          grep -q 'RemoteRouteRegistry' src/Remote/Routes.php
      - name: Commit catalogs
        shell: bash
        run: |
          git config user.name 'Core Blueprint CI'
          git config user.email 'actions@users.noreply.github.com'
          git add languages/
          git diff --cached --check
          git commit -m 'Add Backups launch translation catalogs'
          git push origin HEAD:qc/backups-launch-readiness
