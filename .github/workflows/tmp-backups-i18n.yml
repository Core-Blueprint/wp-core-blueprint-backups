name: Temporary Backups i18n

on:
  push:
    branches:
      - qc/backups-launch-readiness
    paths:
      - '.github/workflows/tmp-backups-i18n.yml'

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog tooling
        run: |
          python -m pip install --disable-pip-version-check polib deep-translator
          sudo apt-get update -qq && sudo apt-get install -y gettext
      - name: Build translated catalogs
        run: python tools/tmp-translate-catalogs.py
      - name: Validate catalogs
        run: |
          set -euo pipefail
          for locale in nl_NL de_DE fr_FR es_ES it_IT pt_PT; do
            po="languages/core-blueprint-backups-${locale}.po"
            mo="languages/core-blueprint-backups-${locale}.mo"
            test -s "$po"
            test -s "$mo"
            msgfmt --check --check-format -o "/tmp/${locale}.mo" "$po"
            msgcmp --use-fuzzy "$po" languages/core-blueprint-backups.pot
          done
      - name: Commit catalogs
        run: |
          git config user.name 'Core Blueprint CI'
          git config user.email 'actions@users.noreply.github.com'
          git add languages/
          git diff --cached --check
          git commit -m 'Add Backups launch translation catalogs'
          git push origin HEAD:qc/backups-launch-readiness
